name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Historical metric verification
        run: python scripts/verify_results.py
      - name: Release content check
        run: python scripts/check_release.py
      - name: Deterministic regression scenarios
        run: python run.py mock
      - name: Offline profile integration smoke test
        run: python run.py live --provider fake --only IE KU CMD --variants before search --out smoke
